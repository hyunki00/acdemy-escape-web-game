<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학원 탈출 게임 - 포인트앤클릭 프로토타입</title>
<style>
  :root{
    --navy:#1b2a41;
    --navy-deep:#131f30;
    --slate:#3e5c76;
    --slate-lt:#eff3f7;
    --amber:#b23a52;
    --amber-lt:#fbe8c8;
    --amber-dark:#8a5a12;
    --white:#ffffff;
    --text-dark:#1b2a41;
    --text-muted:#5f6b7a;
    --danger:#a5424a;
    --font-head: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --font-body: 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'SF Mono', Consolas, 'Courier New', monospace;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh;
    background: radial-gradient(ellipse at 50% -10%, rgba(242,165,65,0.08), transparent 55%), var(--navy-deep);
    color:var(--text-dark);
    font-family:var(--font-body);
    display:flex; align-items:center; justify-content:center;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color: transparent;
  }
  input, textarea{ -webkit-user-select:text; user-select:text; }

  #frame{
    width:100%;
    height:100vh;
    background:var(--white);
    overflow:hidden;
    display:flex; flex-direction:column;
  }

  /* ---------- 상단 바 ---------- */
  #topbar{
    background:var(--navy); color:var(--white);
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; flex-shrink:0;
  }
  #topbar .logo{ font-family:var(--font-head); font-weight:bold; font-size:1rem; }
  #topbar .logo small{ display:block; font-family:var(--font-body); font-size:0.55rem; letter-spacing:1.5px; color:var(--amber); }
  #timer{ font-family:var(--font-mono); font-size:0.95rem; color:var(--amber); }
  #settingsBtn{ background:none; border:none; color:var(--white); font-size:1.1rem; cursor:pointer; padding:4px 6px; }

  /* ---------- 캡션 (방 이름) ---------- */
  #captionBar{
    background:var(--slate-lt); padding:10px 14px 6px; flex-shrink:0;
  }
  #roomTitle{ font-family:var(--font-head); font-size:1.05rem; font-weight:bold; color:var(--navy); margin:0; }
  #roomDesc{ font-size:0.76rem; color:var(--text-muted); margin:2px 0 0; line-height:1.35; }

  /* ---------- 씬(배경 그림) ---------- */
  #sceneWrap{
    position:relative;
    background:#0d1520;
    flex:1; min-height:0; overflow:hidden;
  }
  #sceneArt{ position:absolute; inset:0; display:block; opacity:1; transition:opacity 0.5s ease; }
  #sceneArt.fade-out{ opacity:0; }
  #sceneArt svg{ width:100%; height:100%; display:block; }
  .hotspot-region{ fill:transparent; stroke:transparent; stroke-width:3; cursor:pointer; transition:fill .15s ease, stroke .15s ease; }
  .hotspot-region:hover{ fill:rgba(242,165,65,0.16); stroke:rgba(242,165,65,0.85); }
  .hotspot-region.is-solved{ stroke:rgba(63,138,74,0.55); }
  .hotspot-region.is-solved:hover{ fill:rgba(63,138,74,0.16); }

  /* ---------- 이미지 기반 씬 (실사 → 게임 그래픽 변환 자산) ---------- */
  .image-scene{ position:absolute; inset:0; overflow:hidden; }
  .image-scene img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#05080c; display:block; }
  .hitbox-layer{ position:absolute; pointer-events:none; }
  .hitbox-layer > *{
    pointer-events:auto; cursor:pointer;
    fill:rgba(255,221,51,0); stroke:transparent; stroke-width:0.5;
    vector-effect:non-scaling-stroke;
    transition:fill .15s ease, stroke .15s ease;
  }
  .hitbox-layer > *:hover{ fill:rgba(255,221,51,0.22); stroke:#ffdd33; }
  body.dialogue-active .hitbox-layer > *{ pointer-events:none !important; }
  body.dialogue-active #sceneWrap{ cursor:pointer; }
  .hitbox-layer > .is-solved{ stroke:rgba(120,220,140,0.85); }
  .hitbox-layer > .is-solved:hover{ fill:rgba(120,220,140,0.2); }
  .lit-overlay{
    mix-blend-mode:screen;
    filter:drop-shadow(0 0 4px rgba(255,240,160,0.85));
    animation: litPulse 2.2s ease-in-out infinite;
  }
  .lit-text{
    fill:rgba(58,42,6,0.82); font-family:var(--font-mono); font-weight:bold;
    font-size:5px; paint-order:stroke; stroke:rgba(255,255,255,0.7); stroke-width:0.4px;
  }
  @keyframes litPulse{
    0%, 100% { opacity:0.8; }
    50% { opacity:1; }
  }
  .flicker-overlay{
    position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(circle at 50% 22%, rgba(255,50,50,0.38), transparent 55%);
    mix-blend-mode: screen;
    animation: flicker 3.4s infinite;
  }
  @keyframes flicker{
    0%, 19%, 21%, 23%, 55%, 57%, 100% { opacity: 0.15; }
    20%, 22%, 56% { opacity: 0.6; }
    50% { opacity: 0.25; }
  }

  /* ---------- 씬 하단 오버레이 스택 (대화바가 항상 이동 버튼들보다 위) ---------- */
  #bottomStack{
    position:absolute; left:0; right:0; bottom:0; z-index:40;
    display:flex; flex-direction:column-reverse;
  }

  /* ---------- 이동(화살표) 오버레이 ---------- */
  #navOverlay{
    display:none; flex-wrap:wrap; gap:6px;
    padding:8px; background:linear-gradient(0deg, rgba(0,0,0,0.65), rgba(0,0,0,0));
  }
  #navOverlay.show{ display:flex; }
  .nav-btn{
    flex:1 1 auto;
    background:var(--amber); color:var(--navy);
    border:none; border-radius:7px; padding:8px 9px;
    font-size:0.74rem; font-weight:bold; cursor:pointer; white-space:nowrap;
  }
  .nav-btn.locked{ background:rgba(216,222,230,0.9); color:var(--text-muted); }

  #moveToggleWrap{ padding:10px 14px; background:var(--slate-lt); flex-shrink:0; }
  #moveToggleBtn{
    width:100%; background:var(--navy); color:var(--white); border:none; border-radius:10px;
    padding:10px 0; font-size:0.88rem; font-family:var(--font-body); cursor:pointer;
  }

  /* ---------- 인벤토리 바 ---------- */
  #invbar{
    background:var(--navy); display:flex; align-items:center; gap:12px;
    padding:14px 18px; min-height:76px; flex-shrink:0; flex-wrap:wrap;
  }
  #invbar .lbl{ font-size:0.72rem; letter-spacing:1.5px; color:var(--amber); text-transform:uppercase; margin-right:6px; }
  .inv-item{
    width:48px; height:48px; border-radius:9px;
    background:rgba(255,255,255,0.05);
    border:1.5px dashed rgba(255,255,255,0.18);
    display:flex; align-items:center; justify-content:center; font-size:1.5rem;
  }
  .inv-item:not(.empty){
    background:linear-gradient(160deg, var(--amber), #d98a1f);
    box-shadow:0 2px 6px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.15);
    border:1.5px solid transparent;
  }

  /* ---------- 모달 ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(10,13,20,0.72);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:80; padding:16px;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .modal{
    background:var(--white); border-radius:14px; padding:26px 24px;
    width:100%; max-width:min(640px, 92vw); max-height:88vh; overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,0.5); position:relative;
  }
  .modal h3{ font-family:var(--font-head); margin:0 0 6px; font-size:1.35rem; color:var(--navy); }
  .modal .sub{ font-size:0.95rem; color:var(--text-muted); margin:0 0 16px; }
  .modal-close{ position:absolute; top:14px; right:14px; background:none; border:none; font-size:1.3rem; color:var(--text-muted); cursor:pointer; }
  .dialogue-bar{
    background:linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.68) 55%, transparent 100%);
    padding:64px 26px 34px;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .dialogue-bar.show{ opacity:1; pointer-events:auto; cursor:pointer; }
  .dialogue-bar-text{ color:#f4f4f4; font-size:1.15rem; line-height:1.7; margin:0 auto; max-width:640px; text-align:center; text-shadow:0 1px 3px rgba(0,0,0,0.6); }
  .dialogue-next{ display:inline-block; margin-left:4px; color:var(--amber); animation:dialogueBounce 1s ease-in-out infinite; }
  @keyframes dialogueBounce{
    0%, 100% { transform:translateY(0); opacity:0.7; }
    50% { transform:translateY(3px); opacity:1; }
  }
  .code-box{
    background:var(--navy); color:#e8edf3; font-family:var(--font-mono); font-size:1.05rem;
    border-radius:8px; padding:18px; white-space:pre-wrap; word-break:break-word; line-height:1.9; margin-bottom:16px;
  }
  .code-box .blank-marker{
    display:inline-block; min-width:70px; padding:2px 12px; margin:0 2px;
    background:var(--amber-lt); color:var(--amber-dark); border:1.5px dashed var(--amber);
    border-radius:5px; font-weight:bold; text-align:center;
  }
  .answer-row{ display:flex; gap:10px; margin-bottom:14px; }
  .answer-row input{ flex:1; font-family:var(--font-mono); font-size:1.1rem; padding:11px 12px; border:1px solid #cfd6de; border-radius:8px; }
  .btn{ font-family:var(--font-body); background:var(--navy); color:var(--white); border:none; border-radius:8px; padding:11px 20px; font-size:1rem; cursor:pointer; }
  .btn.secondary{ background:var(--slate-lt); color:var(--text-dark); }
  .feedback{ font-size:0.95rem; margin-top:6px; min-height:1.3em; }
  .feedback.ok{ color:#2f7a3a; }
  .feedback.info{ color:var(--navy); }
  .feedback.bad{ color:var(--danger); }
  .checklist{ margin:6px 0 14px; }
  .checklist li{ font-size:0.95rem; margin-bottom:8px; list-style:none; display:flex; align-items:center; gap:6px; }
  .checklist .dot{ width:9px; height:9px; border-radius:50%; background:#c7cfd8; flex-shrink:0; }
  .checklist .dot.on{ background:#3f8a4a; }
  .keypad-display{ font-family:var(--font-mono); font-size:1.6rem; letter-spacing:6px; text-align:center; background:var(--navy-deep); color:var(--amber); border-radius:8px; padding:12px; margin-bottom:10px; }
  .keypad-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .key{ font-family:var(--font-mono); font-size:1.1rem; background:var(--slate-lt); border:1px solid #dbe2ea; border-radius:6px; padding:12px 0; cursor:pointer; }
  .key:hover{ background:#e2e8ee; }

  /* ---------- 도어락 스타일 잠금 모달 (사진 속 실제 도어락 느낌) ---------- */
  .modal.lock-modal{
    background:linear-gradient(160deg, #17181c, #0a0a0c);
    border:1px solid rgba(120,170,255,0.18);
    box-shadow:0 20px 60px rgba(0,0,0,0.7), inset 0 0 40px rgba(80,140,255,0.05);
  }
  .modal.lock-modal h3{ color:#cfe3ff; font-family:var(--font-body); letter-spacing:0.5px; }
  .modal.lock-modal .sub{ color:#8aa0c0; }
  .modal.lock-modal .modal-close{ color:#8aa0c0; }
  .lock-modal .keypad-display{
    background:#050608; color:#6fc3ff; border:1px solid rgba(111,195,255,0.35);
    text-shadow:0 0 10px rgba(111,195,255,0.85), 0 0 22px rgba(111,195,255,0.35);
    font-size:1.9rem; letter-spacing:10px; padding:16px;
  }
  .lock-modal .keypad-grid{ gap:10px; }
  .lock-modal .key{
    background:#101114; color:#7fc4ff; border:1px solid rgba(111,195,255,0.22);
    border-radius:8px; font-size:1.3rem; padding:16px 0;
    text-shadow:0 0 8px rgba(111,195,255,0.7);
    transition:background .12s ease, box-shadow .12s ease;
  }
  .lock-modal .key:hover{ background:#181a1f; box-shadow:0 0 14px rgba(111,195,255,0.35); }
  .lock-modal .key.key-clear, .lock-modal .key.key-back{ color:#ff9d9d; text-shadow:0 0 8px rgba(255,120,120,0.6); }
  .lock-modal .feedback.bad{ color:#ff6b7a; }
  .lock-modal .feedback.ok{ color:#7fe0a0; }

  /* ---------- 화면 중앙 이미지 팝업 ---------- */
  .image-popup{
    position:fixed; top:40%; left:50%; transform:translate(-50%,-50%) scale(0.94);
    z-index:95; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
  }
  .image-popup.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  .image-popup img{
    display:block; max-width:min(60vw, 320px); max-height:46vh; width:auto;
    border-radius:12px; box-shadow:0 25px 60px rgba(0,0,0,0.7); border:2px solid rgba(255,255,255,0.12);
  }
  .choice-prompt{ font-size:1rem; line-height:1.75; color:var(--text-dark); margin:0 0 16px; }
  .choice-btn{
    display:block; width:100%; text-align:left; margin-bottom:10px;
    padding:13px 14px; border:1px solid #cfd6de; border-radius:8px;
    background:var(--white); color:var(--text-dark);
    font-family:var(--font-body); font-size:1rem; cursor:pointer; transition:background .12s ease, border-color .12s ease;
  }
  .choice-btn:hover:not(:disabled){ background:var(--slate-lt); border-color:var(--slate); }
  .choice-btn.correct{ border-color:#3f8a4a; background:#e9f5ea; color:#2f7a3a; font-weight:bold; }
  .choice-btn:disabled{ cursor:default; opacity:0.75; }
</style>
</head>
<body>

<audio id="bgmAudio" src="Sound/bgm.mp3" loop preload="auto"></audio>
<audio id="doorlockBeepAudio" src="Sound/doorlock-beep.mp3" preload="auto"></audio>
<audio id="doorlockOpenAudio" src="Sound/doorlock-open.mp3" preload="auto"></audio>
<audio id="doorlockWrongAudio" src="Sound/doorlock-wrong.mp3" preload="auto"></audio>
<audio id="walkAudio" src="Sound/walk.mp3" preload="auto"></audio>

<div id="frame">
  <div id="topbar">
    <div class="logo">학원 탈출<small>JAVA ESCAPE · POINT & CLICK</small></div>
    <div id="timer">00:00</div>
    <button id="settingsBtn" aria-label="설정">⚙</button>
  </div>

  <div id="captionBar">
    <h2 id="roomTitle">-</h2>
    <p id="roomDesc"></p>
  </div>

  <div id="sceneWrap">
    <div id="sceneArt"></div>
    <div id="bottomStack">
      <div id="navOverlay"></div>
      <div id="dialogueBar" class="dialogue-bar"><p id="dialogueBarText" class="dialogue-bar-text"></p></div>
    </div>
  </div>

  <div id="moveToggleWrap">
    <button id="moveToggleBtn">🚶 이동</button>
  </div>

  <div id="invbar">
    <span class="lbl">소지품</span>
    <div id="invItems" style="display:flex; gap:8px;"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalBody"></div>
</div>

<div class="image-popup" id="imagePopup">
  <img id="imagePopupImg" src="" alt="">
</div>

<script src="draw.js"></script>
<script src="data.js"></script>
<script src="ui.js"></script>
<script src="puzzle.js"></script>
<script src="lock.js"></script>
<script src="inventory.js"></script>
<script src="navigation.js"></script>
<script src="main.js"></script>

</body>
</html>
