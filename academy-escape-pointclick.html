<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학원 탈출 게임 - 포인트앤클릭 프로토타입</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="wakeOverlay"></div>
<div id="tutorial"><div class="modal modal-narrow" id="tutorialBody"></div></div>
<p id="dialogueMeasure" class="dialogue-bar-text"></p>

<div id="frame">
  <div id="topbar">
    <div class="logo">학원 탈출<small>JAVA ESCAPE · POINT & CLICK</small></div>
    <div id="timer">00:00</div>
    <button id="settingsBtn" aria-label="설정">⚙</button>
  </div>

  <div id="captionBar">
    <h2 id="roomTitle">-</h2>
    <p id="roomDesc"></p>
  </div>

  <div id="sceneWrap">
    <div id="sceneArt"></div>
    <video id="endingVideo" playsinline preload="none"></video>
    <div id="bottomStack">
      <div id="navOverlay"></div>
      <div id="dialogueBar" class="dialogue-bar">
        <p id="dialogueBarText" class="dialogue-bar-text"><span id="dialogueTextInner"></span><span class="dialogue-next">▽</span></p>
      </div>
    </div>
  </div>

  <div id="invbar">
    <div class="invbar-left">
      <span class="lbl">소지품</span>
      <div id="invItems"></div>
    </div>
    <button id="moveToggleBtn">이동</button>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>
<div class="image-popup" id="imagePopup"><img id="imagePopupImg" src="" alt=""></div>
<div class="item-popup" id="itemPopup">
  <div class="item-popup-icon" id="itemPopupIcon"></div>
  <div class="item-popup-name" id="itemPopupName"></div>
</div>

<!-- 순서 중요: data → 기능들 → main(마지막) -->
<script src="data.js"></script>
<script src="audio.js"></script>
<script src="ui.js"></script>
<script src="scene.js"></script>
<script src="inventory.js"></script>
<script src="puzzle.js"></script>
<script src="lock.js"></script>
<script src="phone.js"></script>
<script src="main.js"></script>

</body>
</html>
