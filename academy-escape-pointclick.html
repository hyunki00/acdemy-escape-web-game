<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학원 탈출 게임 - 포인트앤클릭 프로토타입</title>
<style>
  :root{
    --navy:#1b2a41;
    --navy-deep:#131f30;
    --slate:#3e5c76;
    --slate-lt:#eff3f7;
    --amber:#b23a52;
    --amber-lt:#fbe8c8;
    --amber-dark:#8a5a12;
    --white:#ffffff;
    --text-dark:#1b2a41;
    --text-muted:#5f6b7a;
    --danger:#a5424a;
    --font-head: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --font-body: 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'SF Mono', Consolas, 'Courier New', monospace;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh;
    background: radial-gradient(ellipse at 50% -10%, rgba(242,165,65,0.08), transparent 55%), var(--navy-deep);
    color:var(--text-dark);
    font-family:var(--font-body);
    display:flex; align-items:center; justify-content:center;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color: transparent;
  }
  input, textarea{ -webkit-user-select:text; user-select:text; }

  #frame{
    width:100%;
    height:100vh;
    background:var(--white);
    overflow:hidden;
    display:flex; flex-direction:column;
  }

  /* ---------- 상단 바 ---------- */
  #topbar{
    background:var(--navy); color:var(--white);
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; flex-shrink:0;
  }
  #topbar .logo{ font-family:var(--font-head); font-weight:bold; font-size:1rem; }
  #topbar .logo small{ display:block; font-family:var(--font-body); font-size:0.55rem; letter-spacing:1.5px; color:var(--amber); }
  #timer{ font-family:var(--font-mono); font-size:0.95rem; color:var(--amber); }
  #settingsBtn{ background:none; border:none; color:var(--white); font-size:1.1rem; cursor:pointer; padding:4px 6px; }

  /* ---------- 캡션 (방 이름) ---------- */
  #captionBar{
    background:var(--slate-lt); padding:10px 14px 6px; flex-shrink:0;
  }
  #roomTitle{ font-family:var(--font-head); font-size:1.05rem; font-weight:bold; color:var(--navy); margin:0; }
  #roomDesc{ font-size:0.76rem; color:var(--text-muted); margin:2px 0 0; line-height:1.35; }

  /* ---------- 씬(배경 그림) ---------- */
  #sceneWrap{
    position:relative;
    background:#0d1520;
    flex:1; min-height:0; overflow:hidden;
  }
  #sceneArt{ position:absolute; inset:0; display:block; opacity:1; transition:opacity 0.5s ease; }
  #sceneArt.fade-out{ opacity:0; }
  #sceneArt svg{ width:100%; height:100%; display:block; }
  .hotspot-region{ fill:transparent; stroke:transparent; stroke-width:3; cursor:pointer; transition:fill .15s ease, stroke .15s ease; }
  .hotspot-region:hover{ fill:rgba(242,165,65,0.16); stroke:rgba(242,165,65,0.85); }
  .hotspot-region.is-solved{ stroke:rgba(63,138,74,0.55); }
  .hotspot-region.is-solved:hover{ fill:rgba(63,138,74,0.16); }

  /* ---------- 이미지 기반 씬 (실사 → 게임 그래픽 변환 자산) ---------- */
  .image-scene{ position:absolute; inset:0; overflow:hidden; }
  .image-scene img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#05080c; display:block; }
  .hitbox-layer{ position:absolute; pointer-events:none; }
  .hitbox-layer > *{
    pointer-events:auto; cursor:pointer;
    fill:rgba(255,221,51,0); stroke:transparent; stroke-width:0.5;
    vector-effect:non-scaling-stroke;
    transition:fill .15s ease, stroke .15s ease;
  }
  .hitbox-layer > *:hover{ fill:rgba(255,221,51,0.22); stroke:#ffdd33; }
  body.dialogue-active .hitbox-layer > *{ pointer-events:none !important; }
  body.dialogue-active #sceneWrap{ cursor:pointer; }
  .hitbox-layer > .is-solved{ stroke:rgba(120,220,140,0.85); }
  .hitbox-layer > .is-solved:hover{ fill:rgba(120,220,140,0.2); }
  .lit-overlay{
    mix-blend-mode:screen;
    filter:drop-shadow(0 0 4px rgba(255,240,160,0.85));
    animation: litPulse 2.2s ease-in-out infinite;
  }
  .lit-text{
    fill:rgba(58,42,6,0.82); font-family:var(--font-mono); font-weight:bold;
    font-size:5px; paint-order:stroke; stroke:rgba(255,255,255,0.7); stroke-width:0.4px;
  }
  @keyframes litPulse{
    0%, 100% { opacity:0.8; }
    50% { opacity:1; }
  }
  .flicker-overlay{
    position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(circle at 50% 22%, rgba(255,50,50,0.38), transparent 55%);
    mix-blend-mode: screen;
    animation: flicker 3.4s infinite;
  }
  @keyframes flicker{
    0%, 19%, 21%, 23%, 55%, 57%, 100% { opacity: 0.15; }
    20%, 22%, 56% { opacity: 0.6; }
    50% { opacity: 0.25; }
  }

  /* ---------- 씬 하단 오버레이 스택 (대화바가 항상 이동 버튼들보다 위) ---------- */
  #bottomStack{
    position:absolute; left:0; right:0; bottom:0; z-index:40;
    display:flex; flex-direction:column-reverse;
  }

  /* ---------- 이동(화살표) 오버레이 ---------- */
  #navOverlay{
    display:none; flex-wrap:wrap; gap:6px;
    padding:8px; background:linear-gradient(0deg, rgba(0,0,0,0.65), rgba(0,0,0,0));
  }
  #navOverlay.show{ display:flex; }
  .nav-btn{
    flex:1 1 auto;
    background:var(--amber); color:var(--navy);
    border:none; border-radius:7px; padding:8px 9px;
    font-size:0.74rem; font-weight:bold; cursor:pointer; white-space:nowrap;
  }
  .nav-btn.locked{ background:rgba(216,222,230,0.9); color:var(--text-muted); }

  #moveToggleBtn{
    background-image:url('img/ui-move-btn.png'); background-size:100% 100%; background-repeat:no-repeat;
    background-color:transparent; -webkit-appearance:none; appearance:none;
    border:none; outline:none; width:190px; height:56px; flex-shrink:0;
    color:#cfe3ff; font-weight:bold; letter-spacing:1px;
    font-size:0.95rem; font-family:var(--font-body); cursor:pointer;
  }
  #moveToggleBtn:hover{ filter:brightness(1.15); }

  /* ---------- 인벤토리 바 (이동 버튼과 한 줄) ---------- */
  #invbar{
    background-image:url('img/ui-bottom-bar-bg.png'); background-size:cover; background-position:center;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:14px 22px; min-height:84px; flex-shrink:0;
  }
  .invbar-left{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; min-width:0; }
  #invbar .lbl{
    font-size:1.05rem; font-family:var(--font-mono); font-weight:bold; letter-spacing:2px;
    color:#6fc3ff; text-shadow:0 0 8px rgba(111,195,255,0.6); text-transform:uppercase;
    margin-right:8px; flex-shrink:0;
  }
  .inv-item{
    width:52px; height:52px; border-radius:10px;
    background-image:url('img/ui-item-slot.png'); background-size:100% 100%; background-repeat:no-repeat;
    box-shadow:0 0 0 1px rgba(111,195,255,0.25), 0 0 8px rgba(111,195,255,0.12);
    display:flex; align-items:center; justify-content:center; font-size:1.5rem;
    transition:box-shadow .15s ease;
  }
  .inv-item:not(.empty){
    box-shadow:0 0 0 1.5px rgba(111,195,255,0.9), 0 0 16px rgba(111,195,255,0.55);
  }
  .inv-item img{ width:78%; height:78%; object-fit:contain; }
  .inv-item{ position:relative; }
  .inv-item:not(.empty):hover::after{
    content: attr(data-tooltip);
    position:absolute; bottom:calc(100% + 10px); left:50%; transform:translateX(-50%);
    width:max-content; max-width:220px;
    background:#0d0e12; color:#e8edf3; border:1px solid rgba(111,195,255,0.35);
    padding:7px 11px; border-radius:7px; font-size:0.78rem; line-height:1.4;
    box-shadow:0 8px 20px rgba(0,0,0,0.55); z-index:60; pointer-events:none;
  }
  .inv-item:not(.empty):hover::before{
    content:''; position:absolute; bottom:calc(100% + 3px); left:50%; transform:translateX(-50%);
    border:6px solid transparent; border-top-color:#0d0e12; z-index:60; pointer-events:none;
  }

  /* ---------- 모달 ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(10,13,20,0.72);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:80; padding:16px;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .modal{
    background:linear-gradient(160deg, #1c1d22, #0d0e11);
    border:1px solid rgba(120,170,255,0.14);
    border-radius:14px; padding:26px 24px;
    width:100%; max-width:min(640px, 92vw); max-height:88vh; overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,0.7), inset 0 0 40px rgba(80,140,255,0.04); position:relative;
  }
  .modal.modal-narrow{ max-width:min(440px, 88vw); }
  .modal h3{ font-family:var(--font-body); font-weight:bold; margin:0 0 6px; font-size:1.35rem; color:#e8edf5; letter-spacing:0.3px; }
  .modal .sub{ font-size:0.95rem; color:#8aa0c0; margin:0 0 16px; }
  .modal-close{ position:absolute; top:14px; right:14px; background:none; border:none; font-size:1.3rem; color:#8aa0c0; cursor:pointer; }
  .dialogue-bar{
    background:linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.68) 55%, transparent 100%);
    padding:64px 26px 34px;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .dialogue-bar.show{ opacity:1; pointer-events:auto; cursor:pointer; }
  .dialogue-bar-text{ color:#f4f4f4; font-size:1.15rem; line-height:1.7; margin:0 auto; max-width:640px; text-align:center; text-shadow:0 1px 3px rgba(0,0,0,0.6); }
  .dialogue-next{ display:inline-block; margin-left:4px; color:var(--amber); animation:dialogueBounce 1s ease-in-out infinite; }
  @keyframes dialogueBounce{
    0%, 100% { transform:translateY(0); opacity:0.7; }
    50% { transform:translateY(3px); opacity:1; }
  }
  .code-box{
    background:#05060a; color:#e8edf3; font-family:var(--font-mono); font-size:1.05rem;
    border:1px solid rgba(120,170,255,0.15);
    border-radius:8px; padding:18px; white-space:pre-wrap; word-break:break-word; line-height:1.9; margin-bottom:16px;
  }
  .code-box .blank-marker{
    display:inline-block; min-width:70px; padding:2px 12px; margin:0 2px;
    background:var(--amber-lt); color:var(--amber-dark); border:1.5px dashed var(--amber);
    border-radius:5px; font-weight:bold; text-align:center;
  }
  .answer-row{ display:flex; gap:10px; margin-bottom:14px; }
  .answer-row input{
    flex:1; font-family:var(--font-mono); font-size:1.1rem; padding:11px 12px;
    background:#0d0e12; color:#e8edf3; border:1px solid rgba(120,170,255,0.25); border-radius:8px;
  }
  .btn{ font-family:var(--font-body); background:#3f6fd1; color:var(--white); border:none; border-radius:8px; padding:11px 20px; font-size:1rem; cursor:pointer; }
  .btn.secondary{ background:rgba(255,255,255,0.08); color:#cfe3ff; border:1px solid rgba(255,255,255,0.12); }
  .feedback{ font-size:0.95rem; margin-top:6px; min-height:1.3em; }
  .feedback.ok{ color:#7fe0a0; }
  .feedback.info{ color:#cfe3ff; }
  .feedback.bad{ color:#ff6b7a; }
  .checklist{ margin:6px 0 14px; }
  .checklist li{ font-size:0.95rem; margin-bottom:8px; list-style:none; display:flex; align-items:center; gap:6px; color:#cfe3ff; }
  .checklist .dot{ width:9px; height:9px; border-radius:50%; background:#3a3d45; flex-shrink:0; }
  .checklist .dot.on{ background:#3f8a4a; }
  .keypad-display{
    font-family:var(--font-mono); text-align:center; border-radius:8px; margin-bottom:10px;
    background:#050608; color:#6fc3ff; border:1px solid rgba(111,195,255,0.35);
    text-shadow:0 0 10px rgba(111,195,255,0.85), 0 0 22px rgba(111,195,255,0.35);
    font-size:1.9rem; letter-spacing:10px; padding:16px;
  }
  .keypad-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .key{
    background:#101114; color:#7fc4ff; border:1px solid rgba(111,195,255,0.22);
    border-radius:8px; font-family:var(--font-mono); font-size:1.3rem; padding:16px 0; cursor:pointer;
    text-shadow:0 0 8px rgba(111,195,255,0.7);
    transition:background .12s ease, box-shadow .12s ease;
  }
  .key:hover{ background:#181a1f; box-shadow:0 0 14px rgba(111,195,255,0.35); }
  .key.key-clear, .key.key-back{ color:#ff9d9d; text-shadow:0 0 8px rgba(255,120,120,0.6); }

  /* ---------- 도어락 스타일 잠금 모달 (디지털 키패드, 사진 속 실제 도어락 느낌) ---------- */
  .modal.lock-modal{ }

  /* ---------- 콤보락 스타일(회전 다이얼 자물쇠) ---------- */
  .modal.combo-modal{ }
  .combo-lock-body{
    display:flex; justify-content:center; align-items:center; gap:14px;
    background:#0c0d10; border:1px solid rgba(255,255,255,0.08); border-radius:12px;
    padding:22px 18px; margin-bottom:14px;
    box-shadow:inset 0 2px 10px rgba(0,0,0,0.6);
  }
  .combo-dial{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  .combo-dial button{
    width:38px; height:30px; border-radius:6px; border:1px solid rgba(255,255,255,0.15);
    background:#1a1b20; color:#cfe3ff; font-size:1rem; cursor:pointer;
  }
  .combo-dial button:hover{ background:#24262d; }
  .combo-dial .combo-digit{
    width:44px; height:56px; border-radius:6px;
    background:linear-gradient(180deg, #2b2c33, #101114);
    border:1px solid rgba(255,255,255,0.18);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:1.8rem; font-weight:bold; color:#f4f4f4;
    box-shadow:inset 0 2px 4px rgba(0,0,0,0.6);
  }

  /* ---------- 화면 중앙 이미지 팝업 ---------- */
  .image-popup{
    position:fixed; top:40%; left:50%; transform:translate(-50%,-50%) scale(0.94);
    z-index:95; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
  }
  .image-popup.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  .image-popup img{
    display:block; max-width:min(60vw, 320px); max-height:46vh; width:auto;
    border-radius:12px; box-shadow:0 25px 60px rgba(0,0,0,0.7); border:2px solid rgba(255,255,255,0.12);
  }

  /* ---------- 아이템 획득 팝업 (화면 중앙에 크게, 잠깐 떴다가 자동으로 사라짐) ---------- */
  .item-popup{
    position:fixed; top:42%; left:50%; transform:translate(-50%,-50%) scale(0.85);
    z-index:96; opacity:0; pointer-events:none; transition:opacity .3s ease, transform .3s ease;
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .item-popup.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  .item-popup-icon{
    width:140px; height:140px; border-radius:16px;
    background:linear-gradient(160deg, #6b3a30 0%, #4a241d 55%, #3a1a15 100%);
    border:2px solid rgba(233,201,168,0.3);
    box-shadow:0 0 0 1.5px rgba(111,195,255,0.5), 0 0 40px rgba(111,195,255,0.35), 0 25px 50px rgba(0,0,0,0.6);
    display:flex; align-items:center; justify-content:center; font-size:4rem;
  }
  .item-popup-icon img{ width:78%; height:78%; object-fit:contain; }
  .item-popup-name{
    color:#e8edf3; font-family:var(--font-mono); font-weight:bold; font-size:1.1rem;
    text-shadow:0 0 10px rgba(111,195,255,0.6); background:rgba(10,13,20,0.75);
    padding:6px 16px; border-radius:20px; border:1px solid rgba(111,195,255,0.3);
  }
  .choice-prompt{ font-size:1rem; line-height:1.75; color:#e8edf3; margin:0 0 16px; }
  .choice-btn{
    display:block; width:100%; text-align:left; margin-bottom:10px;
    padding:13px 14px; border:1px solid rgba(255,255,255,0.14); border-radius:8px;
    background:#101114; color:#e8edf3;
    font-family:var(--font-body); font-size:1rem; cursor:pointer; transition:background .12s ease, border-color .12s ease;
  }
  .choice-btn:hover:not(:disabled){ background:#181a1f; border-color:rgba(111,195,255,0.4); }
  .choice-btn.correct{ border-color:#3f8a4a; background:rgba(63,138,74,0.18); color:#7fe0a0; font-weight:bold; }
  .choice-btn:disabled{ cursor:default; opacity:0.75; }

  /* ---------- 로그인 폼 (인포데스크 컴퓨터) ---------- */
  .login-form{ display:flex; flex-direction:column; gap:10px; }
  .login-form input{
    font-family:var(--font-mono); font-size:1rem; padding:11px 12px;
    background:#0d0e12; color:#e8edf3; border:1px solid rgba(120,170,255,0.25); border-radius:8px;
  }

  /* ---------- 뉴스 기사 목록 (뉴스 사이트 뷰) ---------- */
  .news-feed{ display:flex; flex-direction:column; gap:12px; max-height:52vh; overflow-y:auto; }
  .news-article{
    background:#0d0e12; border:1px solid rgba(255,255,255,0.1); border-radius:8px;
    padding:12px 14px;
  }
  .news-title{ font-weight:bold; color:#ff8f8f; font-size:0.95rem; margin-bottom:6px; line-height:1.4; }
  .news-body{ color:#c3cbdb; font-size:0.85rem; line-height:1.6; }

  /* ---------- 거울 퍼즐: 붉은 질문 텍스트 / 펜 없을 때 안내문 / 꾹 누르기 연출 ---------- */
  .hold-question{
    font-size:1.3rem; font-weight:bold; color:#ff2b3d; text-align:center;
    text-shadow:0 0 12px rgba(255,40,60,0.55), 0 0 2px rgba(255,40,60,0.8);
    margin:6px 0 16px;
  }
  .hold-missing-msg{ color:#8aa0c0; font-style:italic; font-size:0.85rem; text-align:center; margin-top:18px; }
  .hold-write-area{
    position:relative; height:110px; border-radius:10px; overflow:hidden;
    cursor:url('img/cursor-handkerchief.png') 24 20, auto;
    background:linear-gradient(160deg, #2a2d33, #14151a);
    border:1px solid rgba(255,255,255,0.12);
    margin:14px 0;
    -webkit-user-select:none; user-select:none;
  }
  .hold-answer-text{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:1.6rem; font-weight:bold; color:#ff2b3d;
    text-shadow:0 0 12px rgba(255,40,60,0.7), 0 0 3px rgba(255,40,60,0.9);
    pointer-events:none; -webkit-user-select:none; user-select:none;
  }
  .hold-canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .hold-label{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#8aa0c0; font-size:0.9rem; pointer-events:none; transition:opacity .25s ease;
  }

  /* ---------- 차단기함(breakerbox) — 9개 차단기 + 12개 전선 ---------- */
  .breaker-grid{
    display:grid;
    justify-content:center; margin:12px auto; gap:0;
  }
  .breaker-btn{
    width:56px; height:56px; border-radius:10px; place-self:center;
    background:linear-gradient(160deg, #1a1b20, #0d0e12);
    border:1.5px solid rgba(255,255,255,0.15); color:#5a6272;
    font-size:1.6rem; cursor:pointer; transition:all .15s ease;
  }
  .breaker-btn:hover:not(:disabled){ border-color:rgba(111,195,255,0.5); color:#7fc4ff; }
  .breaker-btn.active{
    background:linear-gradient(160deg, #234a7a, #142a45);
    border-color:#6fc3ff; color:#a8dcff;
    box-shadow:0 0 16px rgba(111,195,255,0.55);
  }
  .breaker-btn.broken{
    background:repeating-linear-gradient(45deg, #1a1214, #1a1214 4px, #241618 4px, #241618 8px);
    border-color:rgba(255,80,80,0.35); color:#7a4040; cursor:not-allowed;
  }
  .breaker-spacer{ width:100%; height:100%; }
  .wire{ place-self:center; background:#23262e; transition:background .15s ease, box-shadow .15s ease; }
  .wire-h{ width:30px; height:10px; border-radius:5px; }
  .wire-v{ width:10px; height:30px; border-radius:5px; }
  .wire.lit{ background:#ffb545; box-shadow:0 0 12px rgba(255,181,69,0.75); }
</style>
</head>
<body>

<audio id="bgmAudio" src="Sound/bgm.mp3" loop preload="auto"></audio>
<audio id="doorlockBeepAudio" src="Sound/doorlock-beep.mp3" preload="auto"></audio>
<audio id="doorlockOpenAudio" src="Sound/doorlock-open.mp3" preload="auto"></audio>
<audio id="doorlockWrongAudio" src="Sound/doorlock-wrong.mp3" preload="auto"></audio>
<audio id="walkAudio" src="Sound/walk.mp3" preload="auto"></audio>
<audio id="sfxAudio" preload="auto"></audio>

<div id="frame">
  <div id="topbar">
    <div class="logo">학원 탈출<small>JAVA ESCAPE · POINT & CLICK</small></div>
    <div id="timer">00:00</div>
    <button id="settingsBtn" aria-label="설정">⚙</button>
  </div>

  <div id="captionBar">
    <h2 id="roomTitle">-</h2>
    <p id="roomDesc"></p>
  </div>

  <div id="sceneWrap">
    <div id="sceneArt"></div>
    <div id="bottomStack">
      <div id="navOverlay"></div>
      <div id="dialogueBar" class="dialogue-bar"><p id="dialogueBarText" class="dialogue-bar-text"></p></div>
    </div>
  </div>

  <div id="invbar">
    <div class="invbar-left">
      <span class="lbl">소지품</span>
      <div id="invItems" style="display:flex; gap:8px;"></div>
    </div>
    <button id="moveToggleBtn">이동</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalBody"></div>
</div>

<div class="image-popup" id="imagePopup">
  <img id="imagePopupImg" src="" alt="">
</div>

<div class="item-popup" id="itemPopup">
  <div class="item-popup-icon" id="itemPopupIcon"></div>
  <div class="item-popup-name" id="itemPopupName"></div>
</div>

<script src="draw.js"></script>
<script src="data.js"></script>
<script src="ui.js"></script>
<script src="puzzle.js"></script>
<script src="lock.js"></script>
<script src="inventory.js"></script>
<script src="navigation.js"></script>
<script src="main.js"></script>

</body>
</html>
